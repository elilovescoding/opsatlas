server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 64k;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location = /healthz { access_log off; return 200 'ok'; }
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_read_timeout 15s;
    proxy_set_header Host $host;
    # The application intentionally applies a conservative shared limit behind this proxy.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
  }
  location /v3/ { proxy_pass http://backend:8080; proxy_set_header Host $host; }
  location /swagger-ui/ {
    proxy_pass http://backend:8080;
    # Swagger's built-in initializer needs its own CSP; this is an authenticated route.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
  }
  location /assets/ { expires 1y; try_files $uri =404; }
  location / { expires -1; try_files $uri $uri/ /index.html; }
}
