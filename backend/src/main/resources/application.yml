spring:
  application:
    name: opsatlas
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/opsatlas}
    username: ${DATABASE_USER:opsatlas}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 8
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  session:
    jdbc:
      initialize-schema: never
    timeout: 30m
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: 8080
  forward-headers-strategy: none
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: strict
      tracking-modes: cookie
  error:
    include-message: never
    include-stacktrace: never
management:
  server:
    port: 8081
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
logging:
  structured:
    format:
      console: ecs
ops:
  registration-enabled: ${REGISTRATION_ENABLED:true}
  demo: ${DEMO_ENABLED:false}
  bootstrap-email: ${BOOTSTRAP_EMAIL:}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
  monitor-host: ${MONITOR_HOST:127.0.0.1}
  monitor-delay: ${MONITOR_DELAY_MS:60000}
springdoc:
  swagger-ui:
    path: /api/docs
